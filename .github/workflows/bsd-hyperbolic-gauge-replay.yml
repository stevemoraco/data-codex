name: BSD hyperbolic gauge independent replay

on:
  push:
    branches:
      - verification/bsd-hyperbolic-gauge-20260812
    paths:
      - "formal-replay/bsd-hyperbolic-gauge/**"
      - ".github/workflows/bsd-hyperbolic-gauge-replay.yml"
  workflow_dispatch:

concurrency:
  group: bsd-hyperbolic-gauge-replay
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel-and-leanchecker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact replay commit
        uses: actions/checkout@v4

      - name: Build with Lean and independently check with LeanChecker
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal-replay/bsd-hyperbolic-gauge
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
          leanchecker: true
          nanoda: false
          nanoda-allow-sorry: false

      - name: Direct source replay and axiom report
        working-directory: formal-replay/bsd-hyperbolic-gauge
        shell: bash
        run: |
          set -euo pipefail
          lake env lean BSDHyperbolicGaugeReplay/Basic.lean | tee lean-axioms.txt
          if grep -RInE '\b(sorry|admit|sorryAx)\b' \
              BSDHyperbolicGaugeReplay.lean BSDHyperbolicGaugeReplay; then
            echo 'Forbidden placeholder found.' >&2
            exit 1
          fi
          echo 'Exact toolchain:'
          lean --version
          echo 'Exact mathlib revision:'
          git -C .lake/packages/mathlib rev-parse HEAD

  nanoda-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Check out exact replay commit
        uses: actions/checkout@v4

      - name: Diagnose nanoda on the current import surface
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal-replay/bsd-hyperbolic-gauge
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
          leanchecker: false
          nanoda: true
          nanoda-allow-sorry: false
