name: BSD hyperbolic gauge independent replay

on:
  push:
    branches:
      - verification/bsd-hyperbolic-gauge-20260812
    paths:
      - "formal-replay/bsd-hyperbolic-gauge/**"
      - ".github/workflows/bsd-hyperbolic-gauge-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-and-independent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact replay commit
        uses: actions/checkout@v4

      - name: Bootstrap exact toolchain and dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd formal-replay/bsd-hyperbolic-gauge
          lake update

      - name: Build with Lean and independently check with nanoda
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal-replay/bsd-hyperbolic-gauge
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          nanoda: true
          nanoda-allow-sorry: false

      - name: Direct source replay and axiom report
        working-directory: formal-replay/bsd-hyperbolic-gauge
        shell: bash
        run: |
          set -euo pipefail
          lake env lean BSDHyperbolicGaugeReplay/Basic.lean | tee lean-axioms.txt
          if grep -RInE '\b(sorry|admit|sorryAx)\b' \
              BSDHyperbolicGaugeReplay.lean BSDHyperbolicGaugeReplay; then
            echo 'Forbidden placeholder found.' >&2
            exit 1
          fi
          echo 'Exact toolchain:'
          lean --version
          echo 'Exact mathlib revision:'
          git -C .lake/packages/mathlib rev-parse HEAD
